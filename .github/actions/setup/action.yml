name: Set up the repository
description: pnpm (the version in the root packageManager), Node and a frozen install, with the pnpm store cached.

inputs:
  node-version:
    description: Node version for the job
    default: 22.14.0

runs:
  using: composite
  steps:
    # The version comes from packageManager in the root package.json; giving one here as well fails the step
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        CYPRESS_INSTALL_BINARY: '0'
