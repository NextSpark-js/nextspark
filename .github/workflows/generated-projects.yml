name: Generated projects

# Projects created from this repository's packages as a new user would: pack the packages once, then for each
# combination create a project from the tarballs, migrate it, build it and serve it. Everything below runs on every push
# to main (main is what gets packed and published); a pull request runs it only when it can change what a project ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'plugins/**'
      - 'scripts/performance/**'
      - 'scripts/packages/**'
      - 'scripts/security/**'
      - 'scripts/deploy/**'
      - 'scripts/accessibility/**'
      - 'scripts/auth/**'
      - 'scripts/plugins/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/**'
      - '.github/workflows/generated-projects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request cancels its own older run; every push to main gets its own group, so none is ever dropped
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The supported matrix (G0 decision 4 and 12): Node 22.14 and 24; pnpm 10 (from 10.34.6), 11 and 12 for the generated
  # project. The repository itself stays on its packageManager (pnpm 9).
  NODE_OLDEST: 22.14.0

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      - name: Pack the packages
        run: ./scripts/packages/pack.sh --all --output "$RUNNER_TEMP/packages"
        env:
          SKIP_MOBILE_VERIFY: '1'

      - name: Upload the tarballs
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          retention-days: 1

      - name: Upload create-nextspark-app
        uses: actions/upload-artifact@v4
        with:
          name: create-nextspark-app-dist
          path: packages/create-nextspark-app/dist
          retention-days: 1

  # Every project template (starter, blog, crm, productivity) on the oldest and the newest Node. The starter also gets
  # its per-route client JavaScript checked against scripts/performance/starter-route-js-budget.json (the 0.1.0-beta.193
  # starter + 5%; signed-out routes free of dashboard code) and the security probes.
  template-build:
    name: template-build (${{ matrix.theme }}, node ${{ matrix.node }})
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { theme: starter, preset: saas, page: /, node: 22.14.0 }
          - { theme: blog, preset: blog, page: /authors, node: 22.14.0 }
          - { theme: crm, preset: crm, page: /dashboard, node: 22.14.0 }
          - { theme: productivity, preset: saas, page: /dashboard, node: 22.14.0 }
          - { theme: starter, preset: saas, page: /, node: '24' }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Create the project
        uses: ./.github/actions/create-project
        with:
          theme: ${{ matrix.theme }}
          preset: ${{ matrix.preset }}

      - name: Migrate, build and serve the project
        uses: ./.github/actions/build-project
        with:
          pages: ${{ matrix.page }}
          probes: ${{ matrix.theme == 'starter' }}

      - name: Check per-route client JavaScript against the budget
        if: matrix.theme == 'starter' && matrix.node == env.NODE_OLDEST
        run: node scripts/performance/starter-route-js.mjs --app "$PROJECT/app" --json "$PROJECT/route-js.json"

      - name: Upload the measurement
        if: always() && matrix.theme == 'starter' && matrix.node == env.NODE_OLDEST
        uses: actions/upload-artifact@v4
        with:
          name: starter-route-js
          path: ${{ runner.temp }}/project/route-js.json
          if-no-files-found: ignore

      # axe-core (WCAG 2.0/2.1/2.2 A and AA rules) through Playwright, on the starter's public pages and, signed in by
      # email OTP, its dashboard, task and profile pages. Fails on any serious or critical violation. The versions of
      # playwright, @axe-core/playwright and axe-core are pinned in the root package.json.
      - name: Install the browser for the accessibility scan
        if: matrix.theme == 'starter' && matrix.node == env.NODE_OLDEST
        run: pnpm exec playwright install --with-deps chromium

      - name: Check accessibility with axe
        if: matrix.theme == 'starter' && matrix.node == env.NODE_OLDEST
        run: node scripts/accessibility/axe-scan.mjs --app "$PROJECT/app" --json "$PROJECT/axe-report.json"

      - name: Upload the accessibility report
        if: always() && matrix.theme == 'starter' && matrix.node == env.NODE_OLDEST
        uses: actions/upload-artifact@v4
        with:
          name: starter-axe-report
          path: ${{ runner.temp }}/project/axe-report.json
          if-no-files-found: ignore

  # Better Auth as the starter ships it, not as core's Jest sees it (Jest maps `better-auth` to a mock, so a Better Auth
  # upgrade can break every auth request with every suite green). The starter is built in domain-open mode, started with
  # a stand-in for Resend, and driven over HTTP: sign-in by email OTP, get-session, a blocked domain, sign-out and the
  # OTP rate limit. Its own job because domain-open is a build-time config change the other jobs must not carry.
  auth-runtime:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      - name: Create the project
        uses: ./.github/actions/create-project
        with:
          theme: starter
          preset: saas

      # Only example.com may register: the check asks for a code at another domain and expects a 403 and no mail
      - name: Allow only example.com to register (domain-open)
        working-directory: ${{ runner.temp }}/project/app
        run: |
          sed -i "s#mode: 'open' as const,#mode: 'domain-open' as const,\n      allowedDomains: ['example.com'],#" config/app.config.ts
          grep -q "mode: 'domain-open'" config/app.config.ts
          grep -q "allowedDomains: \['example.com'\]" config/app.config.ts

      - name: Migrate, build and serve the project
        uses: ./.github/actions/build-project

      - name: Check sign-in, session, sign-out and rate limit on the real Better Auth
        run: node scripts/auth/auth-runtime-check.mjs --app "$PROJECT/app" --port 3980 --allowed-domain example.com

  # The package managers a generated project supports. The project's pnpm comes from Corepack, and the step after the
  # create fails if the pnpm that ran in the project is not the matrix one.
  pnpm:
    name: pnpm ${{ matrix.pnpm }} (node ${{ matrix.node }})
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pnpm: 10.34.6, node: 22.14.0 }
          - { pnpm: 11.28.4, node: '24' }
          # Node 22's bundled Corepack cannot install pnpm 12 (its package no longer has bin/pnpm.cjs): pnpm 12 runs on Node 24
          - { pnpm: 12.9.1, node: '24' }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Create the project with pnpm ${{ matrix.pnpm }}
        uses: ./.github/actions/create-project
        with:
          theme: starter
          preset: saas
          pnpm: ${{ matrix.pnpm }}

      - name: Check the project used pnpm ${{ matrix.pnpm }}
        working-directory: ${{ runner.temp }}/project/app
        run: test "$(pnpm --version)" = "${{ matrix.pnpm }}"

      - name: Migrate, build and serve the project
        uses: ./.github/actions/build-project

  # Legacy ISR is supported and not the default: the same starter with cacheComponents off. Also built once with webpack
  # (the default is Turbopack): its type check caught layouts that took props Next does not declare (#291). That build took
  # 71 s on a laptop, the cost this job adds; the Cache Components layouts were checked the same way and pass.
  legacy-isr:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      - name: Create the project
        uses: ./.github/actions/create-project
        with:
          theme: starter
          preset: saas

      - name: Migrate, build and serve the project with cacheComponents off
        uses: ./.github/actions/build-project
        with:
          legacy-isr: 'true'
          webpack: 'true'
          probes: 'true'

  # Standalone output (`output: 'standalone'`): a starter built with it, copied without the checkout to a separate directory
  # and served there with `node server.js`, alone and behind a TLS proxy. It also checks that the server runs core's
  # instrumentation (its startup line, and an exit with a weak secret). The script is the one to run locally.
  standalone:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: '24'

      - name: Download the packed packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Download the built create-nextspark-app
        uses: actions/download-artifact@v4
        with:
          name: create-nextspark-app-dist
          path: packages/create-nextspark-app/dist

      - name: Deploy the starter as standalone output and check it
        run: scripts/deploy/verify-standalone.sh --packages "$RUNNER_TEMP/packages" --work "$RUNNER_TEMP/standalone" --logs "$RUNNER_TEMP/standalone-logs"
        env:
          PGHOST: localhost
          PGUSER: dbuser
          PGPASSWORD: postgres

      - name: Upload the logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-logs
          path: ${{ runner.temp }}/standalone-logs
          if-no-files-found: ignore
          retention-days: 7

  # The plugin matrix (G0 decision 6) on a starter made from the tarballs: a local and a packaged plugin load and register
  # (build, and the local plugin's route answers), a name collision between two packaged plugins is refused, a core peer
  # range that cannot be met is reported, and removing both leaves the generated files of the untouched starter. The script
  # is the one to run locally; no database is needed. Ordering and cycles are unit-tested in packages/core.
  plugin-matrix:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      - name: Create the project
        uses: ./.github/actions/create-project
        with:
          theme: starter
          preset: saas

      - name: Check the plugin matrix
        run: node scripts/plugins/verify-plugin-matrix.mjs --app "$PROJECT/app" --packages "$PROJECT/.packages" --logs "$RUNNER_TEMP/plugin-matrix-logs" --serve

      - name: Upload the logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-matrix-logs
          path: ${{ runner.temp }}/plugin-matrix-logs
          if-no-files-found: ignore
          retention-days: 7

  # The migrations of every template against the PostgreSQL versions beyond the one the builds use (15).
  migrate:
    name: migrate (${{ matrix.theme }}, postgres ${{ matrix.postgres }})
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [starter, blog, crm, productivity]
        postgres: ['16', '17', '18']
        include:
          - { theme: starter, preset: saas }
          - { theme: blog, preset: blog }
          - { theme: crm, preset: crm }
          - { theme: productivity, preset: saas }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      - name: Create the project
        uses: ./.github/actions/create-project
        with:
          theme: ${{ matrix.theme }}
          preset: ${{ matrix.preset }}

      - name: Migrate the project
        uses: ./.github/actions/build-project
        with:
          migrate-only: 'true'

  # macOS arm64 (G0 decision 7): the starter created from the tarballs, built and served on the macOS runner, then /login
  # and / requested. The runner has no PostgreSQL service, so Homebrew's postgresql@17 is installed and started here,
  # in this job only. One Node and one pnpm version: the Linux jobs carry the matrix. Every RC also gets this by hand.
  macos:
    name: macos arm64 (starter, node 22.14.0)
    needs: pack
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check the runner is arm64
        run: test "$(uname -m)" = arm64

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      # Homebrew's initdb allows local connections without a password; the role is a superuser, as the Linux jobs'
      # POSTGRES_USER is, because the migrations create roles
      - name: Install and start PostgreSQL 17
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          for _ in $(seq 1 30); do pg_isready -h localhost && break; sleep 2; done
          pg_isready -h localhost
          psql -h localhost -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE dbuser SUPERUSER LOGIN PASSWORD 'postgres'"
          createdb -h localhost -O dbuser app

      - name: Create the project
        uses: ./.github/actions/create-project
        with:
          theme: starter
          preset: saas

      - name: Migrate, build and serve the project
        uses: ./.github/actions/build-project
        with:
          pages: /
