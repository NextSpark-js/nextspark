name: Project template migrations

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/core/migrations/**'
      - 'packages/core/scripts/db/**'
      - 'packages/core/templates/projects/**/migrations/**'
      - 'apps/dev/migrations/**'
      - 'apps/dev/**/migrations/**'
      - 'apps/dev/plugins/**/migrations/**'
      - '.github/actions/**'
      - '.github/workflows/theme-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request cancels its own older run; every push to main gets its own group, so none is ever dropped
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.theme }}, postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Install-once templates are extracted into clean root-first projects;
        # default verifies the repository's root-first apps/dev project.
        theme: [blog, crm, default, productivity, starter]
        # 15 is the supported version; 16 and 17 are checked so a migration that only breaks on a newer server shows up
        postgres: ['15', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextspark_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup

      - name: Verify ${{ matrix.theme }} project migrations against a fresh database
        run: pnpm db:verify-theme ${{ matrix.theme }}
        env:
          VERIFY_THEME_DATABASE_URL: postgresql://dbuser:postgres@localhost:5432/nextspark_verify?sslmode=disable
          # The job's postgres service is disposable, so the verifier may create the roles it needs
          VERIFY_THEME_ALLOW_CLUSTER_CHANGES: '1'
