name: Fast test suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request cancels its own older run; every push to main gets its own group, so none is ever dropped
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, '24']
    env:
      # Node 22.14 intermittently fails the test runner's own IPC ("Unable to deserialize cloned data", #210);
      # the plain node --test steps run one file at a time there. Node 24 keeps the default parallelism.
      NODE_TEST_FLAGS: ${{ matrix.node == '22.14.0' && '--test-concurrency=1' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      # CLI and registry tests import @nextsparkjs/core's JavaScript output.
      - name: Build packages used by the fast suites
        run: |
          pnpm --filter @nextsparkjs/ui build
          pnpm --filter @nextsparkjs/core build:js

      - name: Test CLI
        run: pnpm --filter @nextsparkjs/cli test
        env:
          # dependency-engines.test.ts deliberately queries registry.npmjs.org;
          # keep that release-age check out of this offline fast suite.
          NEXTSPARK_OFFLINE_TESTS: '1'
          npm_config_registry: http://127.0.0.1:9

      - name: Test core Node tests
        run: pnpm exec tsx --test packages/core/tests/node/*.test.ts
        env:
          npm_config_registry: http://127.0.0.1:9

      - name: Test registry build scripts
        run: node --test $NODE_TEST_FLAGS $(find packages/core/scripts/build/registry -type f -name '*.test.mjs' -print)
        env:
          npm_config_registry: http://127.0.0.1:9

      - name: Test package, performance, and security scripts
        run: node --test $NODE_TEST_FLAGS scripts/packages/*.test.mjs scripts/performance/*.test.mjs scripts/security/*.test.mjs scripts/accessibility/*.test.mjs
        env:
          npm_config_registry: http://127.0.0.1:9
