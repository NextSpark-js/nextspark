name: Route JavaScript budget verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Test the route JavaScript budget verifier
        run: node --test scripts/performance/verify-route-js-budget.test.mjs

      - name: Test the development credential bundle verifier
        run: node --test scripts/security/verify-no-dev-credentials.test.mjs
