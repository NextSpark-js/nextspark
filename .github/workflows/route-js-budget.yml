name: Route JavaScript budget verifier

on:
  # Every push to main runs it: main is what gets packed and published.
  push:
    branches: [main]
  # A pull request runs it only when it can change how a route's client JavaScript is measured. The measurement of a
  # starter project itself (the template-build job of the Generated projects workflow) has its own path filters.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/performance/**'
      - '.github/workflows/route-js-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request cancels its own older run; every push to main gets its own group, so none is ever dropped
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Test the route JavaScript budget verifiers
        run: node --test scripts/performance/verify-route-js-budget.test.mjs scripts/performance/starter-route-js.test.mjs
