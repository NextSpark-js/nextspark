name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request cancels its own older run; every push to main gets its own group, so none is ever dropped
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm version comes from packageManager in the root package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # react-native 0.81 requires Node >= 20.19.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # apps/mobile and its template compile packages/mobile and packages/ui
      # from source, which resolve their imports from the root install.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # The mobile app imports portable code only: the generated contracts (packages/contracts,
      # DTO types and zod schemas), @nextsparkjs/ui's native entry and @nextsparkjs/mobile. This
      # fails, naming the chain of imports, when anything under apps/mobile or the mobile
      # packages reaches server code, the db, the registries, migrations or a Node-only module.
      - name: Check the mobile import boundary
        run: pnpm mobile:boundary

      # The contracts are generated from apps/dev's entities: a stale or hand-edited module fails here.
      - name: Check the generated contracts are up to date
        run: pnpm contracts:check

      # apps/mobile lives outside the pnpm workspace: mobile:verify installs it
      # on its own, type-checks and tests it, and type-checks the template that
      # ships in @nextsparkjs/mobile.
      - name: Verify apps/mobile and the mobile template
        run: pnpm mobile:verify
