name: Upgrade from older releases

# The same upgrade check as upgrade-183.yml, from the older releases that can still be created: 0.1.0-beta.163 (the oldest
# create-nextspark-app that installs its own core instead of the current one), .170 and .182 (the newest before .183).
# Each entry creates a project as that published create-nextspark-app makes it, customizes it, upgrades it with the
# `nextspark migrate` of this repository's main, then installs, prepares, runs db:migrate, builds and serves it; the job
# fails when any step fails. Releases before .163 are not in the matrix because they cannot be created (see "Supported
# starting versions" in packages/core/docs/17-updates/06-upgrade-0x-projects.md). The .183 start keeps its own workflow.
# It reads only the npm registry and this repository; it needs no secret.
on:
  # a pull request that changes this workflow or the script runs it, since a schedule and a dispatch only exist on main
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-older.yml'
      - 'scripts/upgrade/**'
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request cancels its own older run; the weekly and manual runs each get their own group, so none is dropped
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OLDEST: 22.14.0

jobs:
  upgrade:
    name: upgrade from ${{ matrix.from }} (node 22.14.0, pnpm 10.34.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # an entry that fails says nothing about the others
      fail-fast: false
      matrix:
        from:
          - 0.1.0-beta.163
          - 0.1.0-beta.170
          - 0.1.0-beta.182
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_OLDEST }}

      - name: Pack the packages
        run: ./scripts/packages/pack.sh --all --output "$RUNNER_TEMP/packages"
        env:
          SKIP_MOBILE_VERIFY: '1'

      - name: Upgrade a ${{ matrix.from }} project
        run: node scripts/upgrade/verify-upgrade-183.mjs --from "$FROM" --packages "$RUNNER_TEMP/packages" --work "$RUNNER_TEMP/upgrade-older" --logs "$RUNNER_TEMP/upgrade-older-logs" --pnpm 10.34.6
        env:
          FROM: ${{ matrix.from }}
          PGHOST: localhost
          PGUSER: dbuser
          PGPASSWORD: postgres

      - name: Upload the logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-older-logs-${{ matrix.from }}
          path: ${{ runner.temp }}/upgrade-older-logs
          if-no-files-found: ignore
          retention-days: 7
